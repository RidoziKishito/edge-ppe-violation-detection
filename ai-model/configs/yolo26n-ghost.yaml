# Ultralytics YOLO26 + Ghost Convolution (Lightweight)
# =====================================================
# Based on yolo26.yaml architecture with standard Conv replaced by GhostConv
# in the backbone to reduce parameters by ~20-30% with minimal mAP drop.
#
# Reference: Han et al., "GhostNet: More Features from Cheap Operations", CVPR 2020
#
# Changes from baseline yolo26.yaml:
# - Backbone Conv layers 0, 1, 3, 5, 7 replaced with GhostConv
# - Head downsampling Conv layers 17, 21 replaced with GhostConv
# - C3k2 blocks remain unchanged to preserve feature extraction quality
# - Target: ~20-30% parameter reduction, <1% mAP drop

# Parameters
nc: 80  # number of classes (overridden by data.yaml at runtime)
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with GhostConv replacing standard Conv
backbone:
  - [-1, 1, GhostConv, [64, 3, 2]]          # 0-P1/2  (was Conv)
  - [-1, 1, GhostConv, [128, 3, 2]]         # 1-P2/4  (was Conv)
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2       (unchanged)
  - [-1, 1, GhostConv, [256, 3, 2]]         # 3-P3/8  (was Conv)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4       (unchanged)
  - [-1, 1, GhostConv, [512, 3, 2]]         # 5-P4/16 (was Conv)
  - [-1, 2, C3k2, [512, True]]              # 6       (unchanged)
  - [-1, 1, GhostConv, [1024, 3, 2]]        # 7-P5/32 (was Conv)
  - [-1, 2, C3k2, [1024, True]]             # 8       (unchanged)
  - [-1, 1, SPPF, [1024, 5, 3, True]]       # 9
  - [-1, 2, C2PSA, [1024]]                  # 10

# Head with GhostConv for downsampling
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 - cat backbone P4
  - [-1, 2, C3k2, [512, True]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 - cat backbone P3
  - [-1, 2, C3k2, [256, True]]                    # 16 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]               # 17 (was Conv - downsampling)
  - [[-1, 13], 1, Concat, [1]]                    # 18 - cat head P4
  - [-1, 2, C3k2, [512, True]]                    # 19 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]               # 20 (was Conv - downsampling)
  - [[-1, 10], 1, Concat, [1]]                    # 21 - cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]               # 23 - Detect(P3, P4, P5)
