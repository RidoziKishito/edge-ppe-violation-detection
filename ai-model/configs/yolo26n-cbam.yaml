# Ultralytics YOLO26 + CBAM Attention Module
# ============================================
# Based on yolo26.yaml architecture with CBAM (Channel + Spatial Attention)
# inserted after key C3k2 blocks in the neck/head for improved feature focus
# on small PPE objects (gloves, goggles) in complex construction scenes.
#
# Reference: Woo et al., "CBAM: Convolutional Block Attention Module", ECCV 2018
#
# Changes from baseline yolo26.yaml:
# - Added CBAM blocks after C3k2 in head layers 13, 16, 19, 22
# - CBAM applies channel attention then spatial attention sequentially
# - kernel_size=7 for spatial attention (captures wider context)

# Parameters
nc: 80  # number of classes (overridden by data.yaml at runtime)
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone (unchanged from YOLO26 baseline)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# Head with CBAM attention blocks inserted after each C3k2
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 6], 1, Concat, [1]]                      # 12 - cat backbone P4
  - [-1, 2, C3k2, [512, True]]                     # 13
  - [-1, 1, CBAM, [128]]                           # 14 - CBAM attention on P4 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15
  - [[-1, 4], 1, Concat, [1]]                      # 16 - cat backbone P3
  - [-1, 2, C3k2, [256, True]]                     # 17 (P3/8-small)
  - [-1, 1, CBAM, [64]]                            # 18 - CBAM attention on P3 features

  - [-1, 1, Conv, [256, 3, 2]]                     # 19
  - [[-1, 14], 1, Concat, [1]]                     # 20 - cat head P4
  - [-1, 2, C3k2, [512, True]]                     # 21 (P4/16-medium)
  - [-1, 1, CBAM, [128]]                           # 22 - CBAM attention on fused P4

  - [-1, 1, Conv, [512, 3, 2]]                     # 23
  - [[-1, 10], 1, Concat, [1]]                     # 24 - cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]         # 25 (P5/32-large)
  - [-1, 1, CBAM, [256]]                           # 26 - CBAM attention on fused P5

  - [[18, 22, 26], 1, Detect, [nc]]                # 27 - Detect(P3, P4, P5)
